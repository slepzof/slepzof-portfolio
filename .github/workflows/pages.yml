name: Deploy SLEPZOF GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Setup Python for responsive media
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore optimized image cache
        uses: actions/cache@v4
        with:
          path: .media-cache
          key: ${{ runner.os }}-slepzof-media-${{ hashFiles('assets/**') }}
          restore-keys: |
            ${{ runner.os }}-slepzof-media-
      - name: Install image optimizer
        run: python3 -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Build static site
        env:
          SITE_BASE_PATH: /slepzof-portfolio
        run: python3 scripts/build_static.py
      - name: Check generated responsive images
        run: |
          test -d dist/assets/featured-v25-block3/optimized
          grep -q 'srcset=' dist/index.html
      - name: Validate desktop interaction JavaScript syntax
        run: |
          node --check js/v25-block3-slider-v3.js
          node --check js/v41-markets.js
          node --check js/sections/home-entrance.js
          node --check js/v34-beyond-ui-story.js
          node --check js/sections/beyond-mobile-morph.js
      - name: Validate design-system tokens and homepage assets
        run: python3 scripts/check_design_system.py
      - name: Report CSS/JS dependencies (read-only)
        run: python3 scripts/audit_dependencies.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
