name: Validate SLEPZOF static preview

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          SITE_BASE_PATH: /slepzof-portfolio
        run: python3 scripts/build_static.py
      - name: Validate design-system tokens and homepage assets
        run: python3 scripts/check_design_system.py
      - name: Report CSS/JS dependencies (read-only)
        run: python3 scripts/audit_dependencies.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Verify files
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -d dist/css
          test -d dist/js
          test -f dist/.nojekyll
